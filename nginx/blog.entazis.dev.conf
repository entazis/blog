server {
  listen 80;
  listen [::]:80;
  server_name blog.entazis.dev;

  # If you use HTTPS, put the SSL server block here (recommended).

  root /var/www/blog.entazis.dev;
  index index.html;

  # Static export routing support:
  # - /posts/my-post (no trailing slash) should still resolve to /posts/my-post/index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache immutable build assets aggressively
  location ~* ^/(?:_next|assets|images)/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Optional: prevent indexing of /search (we also set noindex meta)
  location = /search {
    add_header X-Robots-Tag "noindex, follow";
  }
}

