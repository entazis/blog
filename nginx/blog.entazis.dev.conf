map $cookie_locale $cookie_locale_normalized {
  default "";
  "~*^en$" "en";
  "~*^hu$" "hu";
}

map $http_accept_language $accept_locale {
  default "en";
  "~*\\bhu\\b" "hu";
}

map "$cookie_locale_normalized|$accept_locale" $preferred_locale {
  default "en";
  "~*^(en|hu)\\|" $cookie_locale_normalized;
  "~*^\\|(en|hu)$" $accept_locale;
}

server {
  listen 80;
  listen [::]:80;
  server_name blog.entazis.dev;

  # If you use HTTPS, put the SSL server block here (recommended).

  root /var/www/blog.entazis.dev;
  index index.html;

  # Locale enforcement:
  # - Redirect any non-locale URL to /<preferred-locale>/...
  # - preferred locale: cookie -> Accept-Language -> en
  # Avoid redirecting static assets (files with extensions, Next build assets).
  location ~* ^/(?!en(?:/|$)|hu(?:/|$)|_next/|assets/|images/)(?!.*\.[^/]+$)(.*)$ {
    return 302 /$preferred_locale/$1$is_args$args;
  }

  # Static export routing support (strict):
  # - /en/posts/my-post (no trailing slash) resolves to /en/posts/my-post/index.html
  # - Missing pages return 404 (important for missing translations).
  location / {
    try_files $uri $uri/ =404;
  }

  # Cache immutable build assets aggressively
  location ~* ^/(?:_next|assets|images)/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Optional: prevent indexing of /en/search and /hu/search
  location ~* ^/(en|hu)/search/?$ {
    add_header X-Robots-Tag "noindex, follow";
  }
}

